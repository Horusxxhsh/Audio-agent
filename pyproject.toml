[project]
name = "audio-agent"
version = "2.0.0"
description = "AI-powered guitar multi-effects processor with RAG integration"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "openai>=1.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "transformers>=4.30.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "networkx>=3.0.0",
    "sentence-transformers>=2.2.2",
    "chromadb>=0.4.0",
    "faiss-cpu>=1.7.0",
    "nltk>=3.8.0",
]

[project.optional-dependencies]
rag = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.2",
    "faiss-cpu>=1.7.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
eval = [
    "frechet-audio-distance>=0.1.0",
    "matplotlib>=3.7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta:__legacy__"

[tool.setuptools.packages.find]
where = ["Source_new"]

[tool.setuptools.package-dir]
"" = "Source_new"
