schema: spec-driven

# =============================================================================
# 项目上下文 - Audio-Agent 科研项目
# =============================================================================
context: |
  ## 项目概述
  Audio-Agent 是一个神经符号音频智能体科研项目，目标是通过检索增强生成 (RAG)
  和大语言模型 (LLM) 桥接音乐制作中的"语义鸿沟"——将自然语言描述转换为可编辑的 DSP 参数。

  ## 核心贡献
  1. TRR (Texture Resonance Retrieval): 基于 Gram Matrix 的音频纹理检索
  2. Dual-Modal Fusion: 熵加权的文本-音频自适应融合
  3. Constrained Projection: DSP 参数约束投影与修复

  ## 技术栈
  - 实时音频: JUCE (C++)
  - 机器学习: PyTorch, Transformers, Wav2Vec2
  - LLM: DeepSeek API
  - 向量数据库: ChromaDB
  - 音频分离: Demucs

  ## 论文状态
  - 目标会议: TMM
  - 主文件: Paper/main.tex
  - 故事线: Paper/paper_storyline.md

  ## 实验与论文章节映射
  实验目录 → 论文章节对应关系：

  | 实验目录 | 对应论文章节 | 核心内容 |
  |----------|-------------|----------|
  | Experiments/TextureResonance/ | Sec 3.2 Methodology → TRR | Gram Matrix 编码、层选择分析 |
  | Experiments/AblationStudies/ | Sec 4 Experiments | 5种检索方法对比、LLM增强 |
  | Experiments/mushura/ | Sec 4.5 主观听测 | MUSHRA 听测结果 (26被试) |
  | Experiments/Fusion/ | Sec 3.3 Methodology → Fusion | 不确定性融合、鲁棒性测试 |

  ## 论文章节结构
  Paper/main.tex 章节：
  - Sec 1: Introduction (语义鸿沟问题陈述)
  - Sec 2: Related Work (IMP, DDSP, AudioLDM, RAG)
  - Sec 3: Methodology
    - 3.1: Neuro-Symbolic Architecture
    - 3.2: Texture Resonance Retrieval (TRR)
    - 3.3: Uncertainty-Aware Modal Fusion
    - 3.4: Constrained Reasoning & Projection
  - Sec 4: Experiments
    - 4.1: Experimental Setup
    - 4.2: RQ1 - Texture Priors (TRR vs Baselines)
    - 4.3: RQ2 - Neuro-Symbolic Correction
    - 4.4: RQ3 - Robustness via Fusion
  - Sec 5: Discussion
  - Sec 6: Limitations
  - Sec 7: Conclusion

  ## 支持文档索引
  数学推导和理论论证文档：
  - Paper/trr_theoretical_justification.md → TRR 理论论证 (McDermott 2011, 神经科学支持)
  - Paper/fusion_mathematical_formulation.md → 融合数学推导 (熵加权、不确定性量化)
  - Paper/constraint_repair_algorithm.md → 约束修复算法 (Clamping + Interpolation)
  - Paper/hallucination_metric_definition.md → 幻觉度量定义 (Violation Rate, 78% reduction)

  ## 实验脚本索引
  - Experiments/TextureResonance/texture_encoder.py → TRR 核心实现 (Wav2Vec2 + Gram Matrix)
  - Experiments/TextureResonance/layer_selection_analysis.py → 层选择分析
  - Experiments/TextureResonance/compare_texture_representations.py → 纹理表示对比
  - Experiments/AblationStudies/direct_retrieval_comparison.py → 5种检索方法对比
  - Experiments/AblationStudies/llm_retrieval_comparison.py → LLM增强对比
  - Experiments/AblationStudies/robustness_test.py → 鲁棒性测试 (文本模糊/音频噪声)
  - Experiments/AblationStudies/retrieval_comparison_report.md → 消融实验报告 (1082样本)
  - Experiments/mushura/mushra_analysis.py → MUSHRA 听测分析
  - Experiments/common/evaluate.py → 评估指标 (L2, Acc@0.1, Cosine, Module Consistency)
  - Experiments/common/dataset_loader.py → 数据集加载
  - Experiments/common/hybrid_fusion_retriever.py → 混合检索实现

  ## 评估指标定义
  - L2: 归一化欧氏距离，越小越好
  - Acc@0.1: 参数值在±0.1容差内的比例
  - Recall: 激活参数的召回率
  - Cosine: 参数向量方向一致性 (余弦相似度)
  - Module: Jaccard 指数，DSP 模块选择一致性

  ## 研究规范
  - 实验结果需更新到对应实验目录的报告文件
  - 新方法需要独立的理论论证文档
  - 数学推导需包含定理、证明和复杂度分析
  - 论文修订需注明影响的章节和行号
  - 图表生成需更新 Paper/figures/ 目录

  ## 论文投稿要求 - IEEE Signal Processing Society
  目标期刊: IEEE/ACM Transactions on Audio, Speech, and Language Processing

  ### 稿件基本要求
  - 必须提供清晰的问题陈述、贡献声明和意义说明
  - 必须引用最相关的已发表文献
  - 必须说明与已有工作的区别和创新点
  - 稿件不得同时考虑其他期刊或已发表

  ### 稿件格式要求
  - 初稿最长 13 页 (双栏, 10pt 字体)
  - 修订稿最长 16 页 (双栏, 10pt 字体)
  - 使用 IEEE 官方 LaTeX 模板
  - 所有作者必须提供 ORCID ID

  ### 摘要要求
  - 长度: 150-250 词
  - 必须自包含 (无缩写、脚注、公式引用)
  - 应包含关键词/短语以帮助检索

  ### EDICS 分类
  - 必须选择适当的 EDICS 分类 (Editors' Information Classification Scheme)
  - 相关分类: AUD-ANADIS (Audio Analysis), AUD-MASP (Music and Speech Processing)

  ### 补充材料
  - 可包含音频、图像、视频、数据集、代码
  - 鼓励提供可复现所有图表的文件
  - 建议不超过 6 页 (双栏, 10pt 字体)
  - 公式、定理、图表编号应连续 (如 Fig. 10)

  ### 页面费用
  - 自愿页费: $110/页 (前 10 页)
  - 强制页费: $220/页 (超出 10 页部分)
  - 彩色图: 免费 (在线出版)

  ### 即时拒稿条件 (需避免)
  1. 缺乏充分的实验数据
  2. 英语写作不合格
  3. 拼写/语法错误过多
  4. 引用文献不足
  5. 缺乏新颖性 (已知方法的简单组合)

  ### 审稿流程
  - Single-anonymized 审稿 (审稿人匿名, 作者公开)
  - 每篇至少 2 位独立审稿人
  - 接收后不可修改稿件

  ### 开放获取选项
  - 混合出版模式: 传统订阅或 OA (作者付费)
  - IEEE Open Journal of Signal Processing: 完全 OA

  ### 会议转期刊
  - 最多 6 页会议论文可扩展为期刊论文
  - 必须引用先前会议论文
  - 必须有明显新增价值 (额外分析、算法改进、理论工作、实验验证)

# =============================================================================
# 工件规则 - 针对论文写作和优化
# =============================================================================
rules:
  # 提案规则 - 论文改进提案
  proposal:
    - 必须说明改进的论文章节 (Sec X.Y)
    - 新方法需要理论论证 (参考 trr_theoretical_justification.md)
    - 数学推导需独立文档 (参考 fusion_mathematical_formulation.md)
    - 实验设计需包含评估指标 (L2, Acc@0.1, Cosine, Module Consistency)
    - 消融实验需说明对照基线

  # 任务规则 - 实验与论文同步
  tasks:
    - 代码变更需关联到实验脚本和论文章节
    - 实验结果需同步更新到 Paper/main.tex
    - 论文修订需注明 LaTeX 文件和行号
    - 图表生成需更新 Paper/figures/ 目录

  # 规格说明规则 - 方法定义
  specs:
    - 新方法需包含: 问题定义、算法设计、数学分析、实验验证
    - 算法需提供伪代码和复杂度分析
    - 理论声明需包含证明或引用支持
