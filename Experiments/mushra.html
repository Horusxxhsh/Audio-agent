<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio-Agent MUSHRA Evaluation</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .test-case { border: 1px solid #ccc; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        .control-group { margin-bottom: 15px; }
        label { display: inline-block; width: 150px; }
        input[type="range"] { width: 300px; }
        .score { font-weight: bold; margin-left: 10px; }
    </style>
</head>
<body>
    <h1>Audio-Agent Subjective Evaluation</h1>
    <p>Please search/rate the samples based on the Reference audio.</p>

    <div id="experiment-container">
        <!-- Test Case 1 -->
        <div class="test-case">
            <h3>Test Case 1: "Dreamy Shoegaze"</h3>
            <p><strong>Reference:</strong> <button onclick="play('ref')">Play Reference</button></p>
            
            <div class="control-group">
                <label>Sample A:</label>
                <button onclick="play('A')">Play</button>
                <input type="range" min="0" max="100" value="50" oninput="updateScore(this, 'scoreA')">
                <span id="scoreA" class="score">50</span>
            </div>

            <div class="control-group">
                <label>Sample B:</label>
                <button onclick="play('B')">Play</button>
                <input type="range" min="0" max="100" value="50" oninput="updateScore(this, 'scoreB')">
                <span id="scoreB" class="score">50</span>
            </div>

            <div class="control-group">
                <label>Sample C:</label>
                <button onclick="play('C')">Play</button>
                <input type="range" min="0" max="100" value="50" oninput="updateScore(this, 'scoreC')">
                <span id="scoreC" class="score">50</span>
            </div>
            
            <div class="control-group">
                <label>Anchor:</label>
                <button onclick="play('Anchor')">Play</button>
                <input type="range" min="0" max="100" value="50" oninput="updateScore(this, 'scoreAnchor')">
                <span id="scoreAnchor" class="score">50</span>
            </div>
        </div>
    </div>

    <button onclick="submitResults()">Submit Ratings</button>

    <script>
        function updateScore(slider, displayId) {
            document.getElementById(displayId).textContent = slider.value;
        }

        function play(id) {
            console.log("Playing " + id + " (Mock)");
            alert("Playing audio " + id + " (This is a mock UI)");
        }

        function submitResults() {
            alert("Results submitted (Mock)");
            // Save logic would go here
        }
    </script>
</body>
</html>
